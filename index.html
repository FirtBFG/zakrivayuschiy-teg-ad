<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Закрывающий тег</title>
    <link rel="icon" href="./svg/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./images/favicon.png" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
  </head>
  <body class="page">
    <header class="header content-section">
      <h1 class="header__title">&lt;/HTML&gt;</h1>
      <p class="header__subtitle">закрывающий тег</p>
    </header>
    <main class="main">
      <section class="cards content-section" aria-label="История обучения">
        <article class="card">
          <h2 class="card__title">
            Фритрек и нулевой спринт: Подготовка к работе
          </h2>
          <div class="card__image-wrapper">
            <img
              class="card__image"
              src="./images/image.png"
              alt="Пиксельная иллюстрация с видом рабочего стола"
            />
          </div>
          <div class="card__content">
            <p class="card__text">
              Это было самое начало пути. На этом этапе важно было проникнуться
              основами и настроиться на учёбу. И, возможно, подумать, как новые
              знания могут повлиять на ваше будущее.
            </p>
            <p class="card__text">
              Место для ваших воспоминаний о начале обучения.
            </p>
          </div>
          <div class="card__buttons">
            <button
              class="card__icon-button"
              type="button"
              aria-label="Поставить лайк"
            >
              <svg
                class="like-icon"
                width="39"
                height="36"
                viewBox="0 0 39 36"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path d="M12 6H9V9H12V6Z" fill="currentColor" />
                <path d="M15 6H12V9H15V6Z" fill="currentColor" />
                <path d="M9 9H6V12H9V9Z" fill="currentColor" />
                <path d="M9 12H6V15H9V12Z" fill="currentColor" />
                <path d="M9 15H6V18H9V15Z" fill="currentColor" />
                <path d="M18 6H15V9H18V6Z" fill="currentColor" />
                <path d="M12 18H9V21H12V18Z" fill="currentColor" />
                <path d="M15 21H12V24H15V21Z" fill="currentColor" />
                <path d="M18 24H15V27H18V24Z" fill="currentColor" />
                <path d="M27 6H30V9H27V6Z" fill="currentColor" />
                <path d="M24 6H27V9H24V6Z" fill="currentColor" />
                <path d="M30 9H33V12H30V9Z" fill="currentColor" />
                <path d="M30 12H33V15H30V12Z" fill="currentColor" />
                <path d="M30 15H33V18H30V15Z" fill="currentColor" />
                <path d="M21 6H24V9H21V6Z" fill="currentColor" />
                <path d="M27 18H30V21H27V18Z" fill="currentColor" />
                <path d="M24 21H27V24H24V21Z" fill="currentColor" />
                <path d="M21 24H24V27H21V24Z" fill="currentColor" />
                <path d="M21 9H18V12H21V9Z" fill="currentColor" />
                <path d="M21 27H18V30H21V27Z" fill="currentColor" />
              </svg>
            </button>
            <button class="card__like-button button" type="button">
              <span class="button__text">Like</span>
            </button>
          </div>
        </article>
      </section>
    </main>
    <script src="./scripts/like.js"></script>
  </body>
</html>
